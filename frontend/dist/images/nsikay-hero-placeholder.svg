<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06152f"/>
      <stop offset="55%" stop-color="#0b2d5c"/>
      <stop offset="100%" stop-color="#020711"/>
    </linearGradient>

    <radialGradient id="globe" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#f5d77a"/>
      <stop offset="45%" stop-color="#c99a32"/>
      <stop offset="100%" stop-color="#513b0d"/>
    </radialGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0a6"/>
      <stop offset="50%" stop-color="#d6ad42"/>
      <stop offset="100%" stop-color="#8b6417"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- lumière du globe -->
  <circle cx="1130" cy="400" r="260" fill="#d6ad42" opacity=".12" filter="url(#glow)"/>
  <circle cx="1130" cy="400" r="220" fill="url(#globe)" opacity=".94"/>

  <!-- méridiens -->
  <ellipse cx="1130" cy="400" rx="220" ry="80"
           fill="none" stroke="#fff1ad" stroke-width="2" opacity=".45"/>
  <ellipse cx="1130" cy="400" rx="130" ry="220"
           fill="none" stroke="#fff1ad" stroke-width="2" opacity=".35"/>
  <ellipse cx="1130" cy="400" rx="65" ry="220"
           fill="none" stroke="#fff1ad" stroke-width="2" opacity=".25"/>

  <path d="M910 400H1350" stroke="#fff1ad" stroke-width="2" opacity=".3"/>
  <path d="M950 300H1310" stroke="#fff1ad" stroke-width="2" opacity=".2"/>
  <path d="M950 500H1310" stroke="#fff1ad" stroke-width="2" opacity=".2"/>

  <!-- flux internationaux -->
  <g fill="none" stroke="url(#gold)" stroke-width="4" opacity=".8">
    <path d="M1130 400 C900 180 650 160 350 280"/>
    <path d="M1130 400 C900 620 650 700 280 620"/>
    <path d="M1130 400 C1270 180 1420 150 1540 220"/>
    <path d="M1130 400 C1310 570 1440 630 1560 590"/>
  </g>

  <!-- points -->
  <g fill="#fff0a6">
    <circle cx="350" cy="280" r="7"/>
    <circle cx="280" cy="620" r="7"/>
    <circle cx="1540" cy="220" r="7"/>
    <circle cx="1560" cy="590" r="7"/>
  </g>

  <!-- silhouette royale -->
  <g transform="translate(700 175)">
    <!-- dossier du fauteuil -->
    <path d="M170 40
             Q260 0 350 40
             L390 400
             L130 400 Z"
          fill="#071b38"
          stroke="url(#gold)"
          stroke-width="7"/>

    <!-- couronne -->
    <path d="M225 70
             L250 20
             L275 60
             L310 12
             L325 68
             L365 30
             L350 95
             L240 95 Z"
          fill="url(#gold)"/>

    <!-- tête -->
    <circle cx="295" cy="135" r="65" fill="#3b2118"/>

    <!-- vêtements -->
    <path d="M210 205
             Q295 160 380 205
             L435 470
             L155 470 Z"
          fill="#092b58"
          stroke="url(#gold)"
          stroke-width="5"/>

    <!-- manteau -->
    <path d="M220 205 L295 290 L370 205
             L400 470 L190 470 Z"
          fill="#d2a63d"
          opacity=".9"/>

    <!-- fauteuil -->
    <path d="M100 420
             Q295 360 490 420
             L540 670
             L50 670 Z"
          fill="#07172e"
          stroke="url(#gold)"
          stroke-width="9"/>

    <!-- accoudoirs -->
    <path d="M80 450 L20 610 L110 610 L170 470"
          fill="#092b58"
          stroke="url(#gold)"
          stroke-width="7"/>

    <path d="M510 450 L570 610 L480 610 L420 470"
          fill="#092b58"
          stroke="url(#gold)"
          stroke-width="7"/>
  </g>

  <!-- ambiance architecturale -->
  <g opacity=".22" fill="#d6ad42">
    <rect x="50" y="720" width="170" height="120"/>
    <rect x="250" y="680" width="140" height="160"/>
    <rect x="1280" y="690" width="110" height="150"/>
    <rect x="1410" y="650" width="150" height="190"/>
  </g>

  <text x="70" y="800"
        fill="#ffffff"
        opacity=".18"
        font-family="Arial, sans-serif"
        font-size="42"
        font-weight="700"
        letter-spacing="12">
    NSIKAY
  </text>
</svg>