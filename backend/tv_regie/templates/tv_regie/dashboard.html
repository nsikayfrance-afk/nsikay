<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSIKAY TV — Régie</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        header {
            padding: 24px;
            background: #ffffff;
            border-bottom: 1px solid #dfe5ee;
        }

        main {
            padding: 24px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #dfe5ee;
            border-radius: 14px;
            padding: 20px;
        }

        .number {
            font-size: 32px;
            font-weight: 700;
            margin-top: 8px;
        }
    </style>
</head>

<body>

<header>
    <h1>NSIKAY TV — Régie</h1>
    <p>Centre de gestion des caméras, directs, scènes et programmations.</p>
</header>

<main>

    <div class="grid">

        <div class="card">
            <strong>Caméras</strong>
            <div class="number">{{ cameras|length }}</div>
        </div>

        <div class="card">
            <strong>Lives / Streams</strong>
            <div class="number">{{ streams|length }}</div>
        </div>

        <div class="card">
            <strong>Scènes</strong>
            <div class="number">{{ scenes|length }}</div>
        </div>

        <div class="card">
            <strong>Programmations</strong>
            <div class="number">{{ schedules|length }}</div>
        </div>

    </div>

</main>

</body>
</html>
