server {

listen 80;

server_name nsikay.com www.nsikay.com;


location /static/ {

alias /var/www/nsikay/backend/static/;

}


location /media/ {

alias /var/www/nsikay/backend/media/;

}


location / {

proxy_pass http://127.0.0.1:8000;


proxy_set_header Host $host;

proxy_set_header X-Real-IP $remote_addr;

}


}

