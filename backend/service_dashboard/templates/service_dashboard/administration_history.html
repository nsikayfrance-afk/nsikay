<!DOCTYPE html>
<html>

<head>
<title>Historique Administration NSIKAY</title>
</head>

<body>

<h1>📋 Historique Administration NSIKAY</h1>


<table border="1" width="100%">

<tr>
<th>Date</th>
<th>Action</th>
<th>Service</th>
<th>Pays</th>
<th>Administrateur</th>
<th>Commentaire</th>
</tr>


{% for log in logs %}

<tr>

<td>
{{ log.created_at }}
</td>

<td>
{{ log.action }}
</td>

<td>
{{ log.service.name }}
</td>

<td>
{{ log.country.country_name }}
</td>

<td>
{{ log.admin_user.username }}
</td>

<td>
{{ log.comment }}
</td>

</tr>

{% endfor %}


</table>


</body>
</html>
